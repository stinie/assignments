<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 1: Twitter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="sign-in-dialog">
       <div id="dialog-top">
        <button type="button" aria-label="Close">
          ×
        </button>
       </div>
       <div id="dialog-middle">
          <h1>Sign in to Twitter</h1>
          <button type="button">
              <img src="google.png" alt="">
              Sign in with Google
          </button>
          <button type="button">
              <img src="apple.png" alt="">
              <b>Sign in with Apple</b>
          </button>
          <div class="or">
            <span>or</span>
          </div>
          <form action="#" method="POST" id="next-form">
            <input type="text" placeholder="Phone, email, or username" aria-label="Phone, email, or username" name="account">
            <button type="submit">Next</button>
          </form>
          <!-- Kept as a button for now; revisit the semantics later when there is time to decide whether this should be navigation instead. -->
          <button type="button">
            <b>Forgot password?</b>
          </button>
       </div>
       <div id="dialog-bottom">
        Don't have an account? <a href="#">Sign up</a>
      </div>
    </div>
  </body>
</html>

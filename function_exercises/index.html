<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Function Exercises</title>
  <script src="exercise-1.js" defer></script>
  <script src="exercise-3.js" defer></script>
  <script src="exercise-4.js" defer></script>
</head>

<body>
  <h1>Functions</h1>
  <p>Browser-based testing for Exercises 1, 3, and 4.</p>
  <h2>Exercise 1 — Check Age</h2>
  <p>Opens the browser console to test the function.</p>
  <form id="age-form" method="post">
    <label for="age">Enter your age:</label>
    <input type="number" id="age" min="1" max="120" required>
    <button type="submit">Check Age</button>
  </form>
  <h2>Exercise 3 — Ask</h2>
  <button type="button" id="ask-button">Ask Question</button>
  <h2>Exercise 4 — Calculator</h2>
  <button type="button" id="calculator-read-button">Enter Values</button>
  <p>
    Exercises 2 and 5 do not require browser-based testing.
    Their JavaScript solutions can be found in the exercise folder.
  </p>
</body>

</html>

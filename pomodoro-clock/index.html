<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Clock</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <h1>Pomodoro Clock</h1>
  <div id="container">
    <!--Input setting for work minutes-->
    <p id="settings">
      <label for="work-minutes-input">Work minutes:</label>
      <input type="number" id="work-minutes-input" value="25" min="1" max="60">
      <label for="break-minutes-input">Break minutes:</label>
      <input type="number" id="break-minutes-input" value="5" min="1" max="60">
    </p>
    <p id="work" class="label">Work:</p>
    <p id="break" class="label">Break:</p>
    <p id="cycles" class="label">Cycles:</p>
    <!--Work Timer-->
    <div id="work-timer" class="timer">
      <p id="w_minutes">
        25
      </p>
      <p class="semicolon">:</p>
      <p id="w_seconds">00</p>
    </div>

    <!--Cycle Counter-->
    <p id="counter" class="timer">0</p>

    <!--Break Timer-->
    <div id="break-timer" class="timer">
      <p id="b_minutes">05</p>
      <p class="semicolon">:</p>
      <p id="b_seconds">00</p>
    </div>
    <button id="start" class="btn">Start</button>
    <button id="stop" class="btn">Pause</button>
    <button id="reset" class="btn">Reset</button>
  </div>
</body>

</html>
